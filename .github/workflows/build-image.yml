name: Build DevContainer Image
on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/Dockerfile'
      - 'scripts/check-environment.sh'
      - '.github/workflows/build-image.yml'
  workflow_dispatch:
permissions:
  contents: read
  packages: write
concurrency:
  group: build-image-${{ github.ref }}
  cancel-in-progress: true
env:
  IMAGE_NAME: ghcr.io/${{ github.repository_owner }}/latex
  RELEASE_TAG: texlive-2026-20260805
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        with:
          fetch-depth: 0
        uses: actions/checkout@v7
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4
      - name: Login to GitHub Container Registry
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Check the immutable release tag against changed image inputs
        id: release-tag
        env:
          BASE_SHA: ${{ github.event.before }}
        run: ./scripts/check-image-tag.sh "${{ github.event_name }}" "$BASE_SHA"
      - name: Extract Docker metadata
        if: steps.release-tag.outputs.exists != 'true'
        id: meta
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE_NAME }}
          tags: |
            type=raw,value=latest
            type=raw,value=${{ env.RELEASE_TAG }}
            type=sha
      - name: Build image for smoke testing
        if: steps.release-tag.outputs.exists != 'true'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./.devcontainer/Dockerfile
          load: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Smoke test the complete development environment
        if: steps.release-tag.outputs.exists != 'true'
        run: |
          docker run --rm \
            -e CHECK_ENVIRONMENT_TOOLS_ONLY=1 \
            "${IMAGE_NAME}:${RELEASE_TAG}" \
            ./scripts/check-environment.sh
      - name: Push tested image tags
        if: steps.release-tag.outputs.exists != 'true'
        run: |
          while IFS= read -r tag; do
            docker push "$tag"
          done <<< '${{ steps.meta.outputs.tags }}'
