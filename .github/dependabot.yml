version: 2

updates:
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"

    open-pull-requests-limit: 1

    labels:
      - "dependencies"

    groups:
      github-actions:
        patterns:
          - "*"

  - package-ecosystem: "docker"
    directory: "/.devcontainer"
    schedule:
      interval: "weekly"

    open-pull-requests-limit: 1

    labels:
      - "dependencies"

    groups:
      devcontainer:
        patterns:
          - "*"